name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_FORCE: "true"

jobs:
  gate:
    name: install-audit-test-build-lint-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Deterministic tests
        run: |
          pnpm --filter @sigil-protocol/dashboard test:ci
          pnpm --filter @sigil-protocol/sdk test
          pnpm --filter @sigil-protocol/sdk build
          pnpm --filter @sigil-protocol/eliza-plugin test

      - name: Live production probes (advisory)
        continue-on-error: true
        run: pnpm --filter @sigil-protocol/dashboard test:live

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Public proof
        run: pnpm proof:public
